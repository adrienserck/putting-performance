<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Putting Performance">
<link rel="manifest" href="manifest.json">
<title>Putting Performance</title>
<style>
:root{--bg:#07110D;--panel:#0E1B15;--text:#F4F1E8;--gold:#DCC9A2;--gold2:#B9A77F;--green:#174C38;--green2:#3A7659;--muted:#8F9A92;--line:#294638}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 10px}.brand{font-weight:800;letter-spacing:1.5px;color:var(--gold)}.nav{display:flex;gap:7px}
.pill{border-radius:999px;padding:12px 18px;background:var(--green);color:var(--text);font-weight:700}.pill.gold{background:var(--gold);color:var(--bg)}.pill.outline{background:transparent;border:1px solid var(--line);color:var(--gold)}.pill.danger{background:#542c29;color:#fff}.pill.small{padding:9px 13px;font-size:13px}
.hero{text-align:center;padding:54px 0 30px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green2);font-weight:800}.hero h1{font-size:38px;margin:10px 0 8px}.hero p{color:var(--muted);margin:0 auto 28px;max-width:500px}.hero .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0}.row{display:flex;align-items:center;gap:12px}.row.between{justify-content:space-between}.muted{color:var(--muted)}.gold{color:var(--gold)}.title{font-size:24px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.grid{display:grid;gap:10px}.drill{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.drill h3{margin:0;font-size:16px}.drill p{margin:5px 0 0;color:var(--muted);font-size:12px}.drill-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel);border-radius:16px;padding:15px;text-align:center;border:1px solid var(--line)}.stat b{display:block;font-size:20px;color:var(--gold)}.stat span{font-size:11px;color:var(--muted)}
.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.option{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px}.option.active{background:var(--green);border-color:var(--green2)}
.green{background:#20583F;border-radius:28px;height:260px;position:relative;overflow:hidden;border:2px solid var(--line);margin:14px 0}.hole{position:absolute;width:28px;height:28px;border-radius:50%;background:#07110D;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #ffffff22}.ball{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008;left:12%;top:72%;transition:.35s}.metric{text-align:center;padding:12px}.metric b{font-size:32px;color:var(--gold);display:block}.review{max-width:600px;margin:auto}.session{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.empty{text-align:center;padding:60px 10px;color:var(--muted)}.putt{display:grid;grid-template-columns:55px 1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.made{color:#7fca9f}.missed{color:var(--gold)}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}select{width:100%;padding:13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
@media(max-width:560px){header{flex-wrap:wrap;gap:10px}.hero h1{font-size:31px}.hero .actions{grid-template-columns:1fr}.drill{grid-template-columns:1fr}.drill-actions{justify-content:flex-start}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.session{grid-template-columns:1fr}.green{height:220px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">PUTTING PERFORMANCE</div><div class="nav"><button class="pill small outline" onclick="show('settings')">⚙ Settings</button></div></header>
<main id="view"></main>
</div>
<script>
const themes={
"Forest & Cream":{"bg":"#07110D","panel":"#0E1B15","text":"#F4F1E8","gold":"#DCC9A2","gold2":"#B9A77F","green":"#174C38","green2":"#3A7659","muted":"#8F9A92","line":"#294638"},
"Midnight Blue":{"bg":"#080D16","panel":"#111A28","text":"#EEF3F8","gold":"#AFC8E6","gold2":"#7E9FC3","green":"#173E59","green2":"#4B769B","muted":"#8C9AA8","line":"#2A4054"},
"Warm Sand":{"bg":"#17140F","panel":"#272117","text":"#F8F0DF","gold":"#E7C98F","gold2":"#B99B62","green":"#435A3D","green2":"#718A63","muted":"#AAA18E","line":"#514838"},
"Clean Light":{"bg":"#F4F1E8","panel":"#FFFFFF","text":"#17231C","gold":"#8A6A35","gold2":"#B28B4A","green":"#2F684B","green2":"#5E9071","muted":"#6E776F","line":"#CCD7CF"}};
const defs=[
["LUKE DONALD 20-PUTT","20",false],["STAR DRILL","20",true],["3 • 6 • 9 • 12 FT","20",false],["AROUND THE WORLD","18",true],["CLOCK DRILL","24",true],["GATE DRILL","20",false],["LADDER","10",true],["3-PUTT AVOIDANCE","10",false],["PRESSURE PUTTING","20",true],["RANDOM 10-PUTT TOUR TEST","10",false]];
let state=JSON.parse(localStorage.getItem("pp_state")||"null")||{theme:"Forest & Cream",deleted:[],history:[]};
let current=null, review={speed:"Medium",condition:"Good",satisfaction:"Mostly",rating:7};
function save(){localStorage.setItem("pp_state",JSON.stringify(state))}
function theme(){let t=themes[state.theme]||themes["Forest & Cream"];for(const [k,v] of Object.entries(t))document.documentElement.style.setProperty("--"+({"bg":"bg","panel":"panel","text":"text","gold":"gold","gold2":"gold2","green":"green","green2":"green2","muted":"muted","line":"line"}[k]),v)}
theme();
function show(page){({home:home,drills:drills,history:history,settings:settings,putts:putts,attempt:attempt,reviewPage:reviewPage})[page]()}
function home(){document.getElementById("view").innerHTML=`<section class="hero"><div class="eyebrow">TRAIN · TRACK · IMPROVE</div><h1>PUTTING PERFORMANCE</h1><p>A quieter, smarter way to practice your putting.</p><div class="actions"><button class="pill gold" onclick="show('drills')">START PUTTING</button><button class="pill outline" onclick="show('history')">HISTORY</button></div><button class="pill" style="margin-top:14px" onclick="show('settings')">SETTINGS</button></section>`}
function activeDefs(){return defs.filter(d=>!state.deleted.includes(d[0]))}
function drills(){let html=`<div class="row between"><div><div class="eyebrow">START PUTTING</div><div class="title">Choose your drill</div></div><button class="pill small outline" onclick="home()">Home</button></div><div class="grid" style="margin-top:14px">`;
for(const [n,total,timed] of activeDefs())html+=`<div class="card drill"><div><h3>${n}</h3><p>${total} putts${timed?" · timed":""}</p></div><div class="drill-actions"><button class="pill small" onclick='start(${JSON.stringify(n)},${total},${timed})'>START</button><button class="pill small outline" onclick='details(${JSON.stringify(n)})'>DETAILS</button><button class="pill small danger" onclick='deleteDrill(${JSON.stringify(n)})'>DELETE</button></div></div>`;
html+=`</div><div class="card"><button class="pill outline" onclick="settings()">Settings / restore drills</button></div>`;document.getElementById("view").innerHTML=html}
function deleteDrill(n){if(confirm(`Remove "${n}" from your drill list?`)){if(!state.deleted.includes(n))state.deleted.push(n);save();drills()}}
function start(name,total,timed){current={name,total,timed,i:0,score:0,putts:[],started:timed?Date.now():null};attempt()}
function attempt(){if(current.i>=current.total){reviewPage();return}let distance=[3,4,5,6,8,10,12,15,20][Math.floor(Math.random()*9)],dirs=["Straight","Left","Right"][Math.floor(Math.random()*3)],slopes=["Flat","Uphill","Downhill"][Math.floor(Math.random()*3)];current.putt={attempt:current.i+1,distance,direction:dirs,slope:slopes};document.getElementById("view").innerHTML=`<div class="row between"><div><div class="eyebrow">${current.name}</div><div class="title">Putt ${current.i+1} / ${current.total}</div></div><button class="pill small outline" onclick="show('drills')">Exit</button></div><div class="green"><div class="hole"></div><div class="ball" id="ball"></div></div><div class="metric"><b>${distance} FT</b><span>${dirs} · ${slopes}</span></div><div class="option-grid"><button class="pill gold" onclick="result('made')">MADE</button><button class="pill outline" onclick="result('missed')">MISSED</button></div>`;setTimeout(()=>{let b=document.getElementById("ball");if(b)b.style.left=(45+Math.random()*35)+"%";if(b)b.style.top=(35+Math.random()*35)+"%"},50)}
function result(r){current.putt.result=r;current.putts.push({...current.putt});if(r==="made")current.score++;current.i++;attempt()}
function reviewPage(){review={speed:"Medium",condition:"Good",satisfaction:"Mostly",rating:7};document.getElementById("view").innerHTML=`<div class="review"><div class="eyebrow">SESSION REVIEW</div><div class="title">${current.name}</div><div class="metric"><b>${current.score}/${current.total}</b><span>${(current.score/current.total*100).toFixed(1)}%</span></div>${choice("GREEN SPEED",["Slow","Medium","Fast","Very Fast"],"speed")}${choice("WAS THE GREEN GOOD?",["Poor","Okay","Good","Excellent"],"condition")}${choice("ARE YOU SATISFIED WITH YOUR PUTTING?",["Not at all","Not really","Mostly","Very satisfied"],"satisfaction")}<label>YOUR PERFORMANCE · 1–10</label><input id="rating" type="range" min="1" max="10" value="7" style="width:100%" oninput="review.rating=+this.value"><button class="pill gold" style="width:100%;margin-top:18px" onclick="saveSession()">SAVE SESSION</button></div>`}
function choice(title,opts,key){return `<label>${title}</label><div class="option-grid">${opts.map(o=>`<button class="option ${review[key]===o?"active":""}" onclick="review.${key}=${JSON.stringify(o)};reviewPage()">${o}</button>`).join("")}</div>`}
function saveSession(){let pct=+(current.score/current.total*100).toFixed(1);state.history.push({id:Date.now(),date:new Date().toLocaleString(),drill:current.name,score:current.score,total:current.total,percentage:pct,green_speed:review.speed,green_condition:review.condition,successful:review.satisfaction,self_rating:review.rating,time_seconds:current.timed&&current.started?Math.round((Date.now()-current.started)/1000):null,putts:current.putts});save();history()}
function history(){let h=state.history;if(!h.length){document.getElementById("view").innerHTML=`<div class="empty">No sessions recorded yet.<br><button class="pill outline" style="margin-top:18px" onclick="home()">Home</button></div>`;return}let avg=(h.reduce((a,x)=>a+(+x.percentage||0),0)/h.length).toFixed(1),rate=(h.reduce((a,x)=>a+(+x.self_rating||0),0)/h.length).toFixed(1);let html=`<div class="row between"><div><div class="eyebrow">YOUR PROGRESS</div><div class="title">Session History</div></div><button class="pill small outline" onclick="home()">Home</button></div><div class="stats" style="margin:14px 0"><div class="stat"><b>${h.length}</b><span>SESSIONS</span></div><div class="stat"><b>${avg}%</b><span>AVG SCORE</span></div><div class="stat"><b>${rate}/10</b><span>AVG RATING</span></div></div>`;
for(const x of [...h].reverse())html+=`<div class="card session"><div><b>${x.drill}</b><div class="sub">${x.date}</div><div class="sub">Green ${x.green_speed} · ${x.green_condition} · Rating ${x.self_rating}/10</div></div><div style="text-align:right"><b class="gold">${x.score}/${x.total}</b><div class="sub">${x.percentage}%</div><div style="margin-top:8px"><button class="pill small outline" onclick="putts(${x.id})">VIEW PUTTS</button><button class="pill small danger" onclick="deleteSession(${x.id})">DELETE</button></div></div></div>`;html+=`<button class="pill outline" onclick="home()">BACK HOME</button>`;document.getElementById("view").innerHTML=html}
function deleteSession(id){if(confirm("Delete this completed drill session from History?")){state.history=state.history.filter(x=>x.id!==id);save();history()}}
function putts(id){let x=state.history.find(a=>a.id===id);if(!x)return;let html=`<div class="row between"><div><div class="eyebrow">SESSION DETAIL</div><div class="title">${x.drill}</div><div class="sub">${x.date} · ${x.score}/${x.total}</div></div><button class="pill small outline" onclick="history()">Back</button></div><div class="card" style="margin-top:14px">`;if(!x.putts?.length)html+=`<div class="empty">This session has no individual putt data.</div>`;else x.putts.forEach(p=>html+=`<div class="putt"><b class="gold">#${p.attempt}</b><span>${p.distance} FT · ${p.direction} · ${p.slope}</span><b class="${p.result==='made'?'made':'missed'}">${p.result.toUpperCase()}</b></div>`);html+=`</div>`;document.getElementById("view").innerHTML=html}
function details(name){let sessions=state.history.filter(x=>x.drill===name);let html=`<div class="row between"><div><div class="eyebrow">DRILL DETAILS</div><div class="title">${name}</div></div><button class="pill small outline" onclick="drills()">Back</button></div>`;if(!sessions.length)html+=`<div class="empty">No saved sessions for this drill yet.</div>`;else sessions.reverse().forEach(x=>html+=`<div class="card"><b>${x.date}</b><div class="sub">${x.score}/${x.total} · ${x.percentage}%</div><button class="pill small outline" style="margin-top:10px" onclick="putts(${x.id})">VIEW PUTTS</button></div>`);document.getElementById("view").innerHTML=html}
function settings(){document.getElementById("view").innerHTML=`<div class="row between"><div><div class="eyebrow">PERSONALISE</div><div class="title">Settings</div></div><button class="pill small outline" onclick="home()">Home</button></div><div class="card"><label>THEME</label><select id="theme">${Object.keys(themes).map(t=>`<option ${t===state.theme?"selected":""}>${t}</option>`).join("")}</select><button class="pill gold" style="margin-top:14px;width:100%" onclick="state.theme=document.getElementById('theme').value;save();theme();settings()">SAVE THEME</button></div><div class="card"><b>DRILL LIBRARY</b><p class="sub">${activeDefs().length} active drills</p><button class="pill outline" onclick="state.deleted=[];save();settings()">RESTORE ALL DRILLS</button></div>`}
home();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
